post:
  tags:
  - Wishlist
  summary: Request to reserve a wish
  description: At least one of friend or anonymous_friend is required. Wish ID is
    taken from the URL.
  consumes:
  - application/json
  produces:
  - application/json
  parameters:
  - name: id
    in: path
    description: user wishlist id
    required: true
    type: string
  - in: body
    name: body
    description: Create Wishlist
    required: true
    schema:
      $ref: ./definitions.yaml#/Request
  responses:
    201:
      description: successful operation
      schema:
        type: object
        properties:
          data:
            $ref: ./definitions.yaml#/RequestComplete
          status:
            type: number
            default: 201
          created:
            type: boolean
    400:
      description: Wish, friend or anonymous friend is invalid, or neither actor was
        supplied.
