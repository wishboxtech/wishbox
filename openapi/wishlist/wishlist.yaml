patch:
  tags:
  - Wishlist
  summary: Edit Wishlist - READY
  description: Partially update a resource owned by the authenticated user. Omitted
    fields remain unchanged.
  consumes:
  - application/json
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  parameters:
  - name: id
    in: path
    description: user wishlist id
    required: true
    type: string
    format: uuid
  - in: body
    name: body
    description: Edit Wishlist
    required: true
    schema:
      $ref: ../wishlist/definitions.yaml#/EditWishlist
  responses:
    200:
      description: successful operation
      schema:
        type: object
        properties:
          data:
            $ref: ../wishlist/definitions.yaml#/Wishlist
          status:
            type: number
            default: 200
          updated:
            type: boolean
    400:
      description: Invalid input, missing resource or failed business validation.
    401:
      description: Authentication required.
    403:
      description: Authenticated user does not own the wishlist.
delete:
  tags:
  - Wishlist
  summary: Delete Wishlist - READY
  description: delete a wishlist
  consumes:
  - application/json
  produces:
  - application/json
  security:
  - ApiKeyAuth: []
  parameters:
  - name: id
    in: path
    description: user wishlist id
    required: true
    type: string
    format: uuid
  responses:
    200:
      description: Deleted successfully.
      schema:
        type: object
        properties:
          deleted:
            type: boolean
          status:
            type: integer
            default: 200
    404:
      description: Resource does not exist.
    429:
      description: Throttled
    400:
      description: Invalid input, missing resource or failed business validation.
    401:
      description: Authentication required.
    403:
      description: Authenticated user does not own the wishlist.
