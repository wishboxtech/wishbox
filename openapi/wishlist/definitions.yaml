EditWishlist:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
    cover:
      type: string
      format: uuid
      x-nullable: true
  description: Partial update. Omitted fields are preserved; cover null clears the
    cover.
Wishlist: &id004
  type: object
  properties:
    id: &id006
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    cover:
      type: object
      x-nullable: true
      properties:
        file:
          type: string
    created_at: &id001
      type: string
      format: date-time
    updated_at: *id001
CreateWish:
  type: object
  required:
  - name
  - description
  - price
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
    cover:
      type: string
      format: uuid
      x-nullable: true
    price:
      type: string
      description: Decimal, at most 10 digits and no fractional digits.
EditWish:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
    cover:
      type: string
      format: uuid
      x-nullable: true
    price:
      type: string
      description: Decimal, at most 10 digits and no fractional digits.
  description: Partial update within the wishlist in the URL. A wish cannot be moved
    using this endpoint.
Wishes:
  type: array
  items: &id003
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      description:
        type: string
      cover:
        type: object
        x-nullable: true
        properties:
          file:
            type: string
      created_at: &id002
        type: string
        format: date-time
      updated_at: *id002
      price:
        type: string
        description: Decimal price without fractional digits.
Wish: *id003
CreateWishlist:
  type: object
  required:
  - name
  - description
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
    cover: &id005
      type: string
      format: uuid
      x-nullable: true
Wishlists:
  type: array
  items: *id004
Request:
  type: object
  description: At least one of friend or anonymous_friend is required. Wish ID is
    taken from the URL.
  properties:
    friend: *id005
    anonymous_friend: *id005
RequestComplete:
  type: object
  properties:
    wish: *id006
    friend: *id005
    anonymous_friend: *id005
    status:
      type: string
      enum:
      - pending
      - accepted
      - rejected
    created_at: *id001
