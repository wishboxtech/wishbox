UserProfile:
  type: "object"
  properties:
    profile_id:
      type: "string"
    phone_number:
      type: "string"
    first_name:
      type: "string"
    last_name:
      type: "string"
    email:
      type: "string"
    birthdate:
      type: "string"
      format: "date"
    gender:
      type: "string"
      default: "M"
    is_phone_number_verified:
      type: "boolean"
    has_accepted_terms:
      type: "boolean"
    photo:
      $ref: "../storage/definitions.yaml#/MediaModel"

UpdateProfile:
  type: "object"
  properties:
    birthdate:
      type: "string"
      format: "date"
    gender:
      type: "string"
      default: "F"
    photo:
      type: "string"
    first_name:
      type: "string"
    last_name:
      type: "string"
    bio:
      type: "string"

CreateProfileRequest:
  type: "object"
  properties:
    birthdate:
      type: "string"
      format: "date"
    gender:
      type: "string"
      default: "F"
    photo:
      type: "string"
    first_name:
      type: "string"
    last_name:
      type: "string"
    bio:
      type: "string"