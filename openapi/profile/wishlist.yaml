  tags:
    - "Profile"
  summary: "Create Wishlist - NOT READY"
  description:
  consumes:
    - "application/json"
  produces:
    - "application/json"
  security:
    - ApiKeyAuth: []
  parameters:
    - name: "id"
      in: "path"
      description: "user profile id"
      required: True
      type: "string"
    - in: "body"
      name: "body"
      description: "Create Wishlist"
      required: true
      schema:
        $ref: "../wishlist/definitions.yaml#/CreateWishlist"
  responses:
    201:
      description: "successful operation"
      schema:
        type: "object"
        properties:
          ok:
            type: "boolean"
            default: true
          data:
            type: "object"
            properties:
              done:
                type: "string"
          status:
            type: "number"
            default: 200
    400:
      description: "Bad Request"
    401:
      description: "Unauthorized"
    403:
      description: "forbidden"

