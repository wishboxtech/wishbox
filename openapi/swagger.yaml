      parameters:
      - name: id
        in: path
        description: user wishlist id
        required: true
        type: string
        format: uuid
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
                default: true
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    description:
                      type: string
                    cover:
                      type: object
                      x-nullable: true
                      properties:
                        file:
                          type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                    price:
                      type: string
                      description: Decimal price without fractional digits.
              status:
                type: number
                default: 200
