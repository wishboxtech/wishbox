  /wishlist/{id}/:
    patch:
      tags:
      - Wishlist
      summary: Edit Wishlist - READY
      description: Partially update a resource owned by the authenticated user. Omitted
        fields remain unchanged.
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        description: user wishlist id
        required: true
        type: string
        format: uuid
      - in: body
        name: body
        description: Edit Wishlist
        required: true
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 150
            description:
              type: string
            cover:
              type: string
              format: uuid
              x-nullable: true
          description: Partial update. Omitted fields are preserved; cover null clears
            the cover.
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                  cover:
                    type: object
                    x-nullable: true
                    properties:
                      file:
                        type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              status:
                type: number
                default: 200
              updated:
                type: boolean
        400:
          description: Invalid input, missing resource or failed business validation.
        401:
          description: Authentication required.
        403:
          description: Authenticated user does not own the wishlist.
    delete:
      tags:
      - Wishlist
      summary: Delete Wishlist - READY
      description: delete a wishlist
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
