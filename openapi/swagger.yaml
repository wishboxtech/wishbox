        in: path
        description: user wishlist id
        required: true
        type: string
        format: uuid
      responses:
        200:
          description: Deleted successfully.
          schema:
            type: object
            properties:
              deleted:
                type: boolean
              status:
                type: integer
                default: 200
        404:
          description: Resource does not exist.
        429:
          description: Throttled
        400:
          description: Invalid input, missing resource or failed business validation.
        401:
          description: Authentication required.
        403:
          description: Authenticated user does not own the wishlist.
    post:
      tags:
      - Wishlist
      summary: Create Wish - READY
      description: create a wish
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        description: user wishlist id
        required: true
        type: string
        format: uuid
      - in: body
        name: body
        description: Create Wishlist
        required: true
        schema:
          type: object
          required:
          - name
          - description
          - price
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 150
            description:
              type: string
            cover:
              type: string
              format: uuid
              x-nullable: true
            price:
              type: string
              description: Decimal, at most 10 digits and no fractional digits.
      responses:
        400:
          description: Invalid input, missing resource or failed business validation.
        401:
          description: Authentication required.
        403:
          description: Authenticated user does not own the wishlist.
        201:
          description: successful operation
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                  cover:
                    type: object
                    x-nullable: true
                    properties:
                      file:
                        type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  price:
                    type: string
                    description: Decimal price without fractional digits.
              status:
                type: number
                default: 201
              created:
                type: boolean
    get:
      tags:
      - Wishlist
      summary: Get Wishes - SEMI READY
      description: get wishes of wishlist
      consumes:
      - application/json
      produces:
      - application/json
      security:
