swagger: '2.0'
info:
  description: Wishox API Dobcumentation; It's WIP
  version: 0.0.0
  title: Wishbox
host: api.gameparty.ir
basePath: /api/V0.0.0
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: access
tags:
- name: AUTH
  description: Authentication
schemes:
- https
- http
paths:
  /auth/otp/:
    post:
      tags:
      - AUTH
      summary: Send OTP - READY
      description: Send a new OTP in order to login or create a new guest
      operationId: sendOTP
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: Sends a new OTP
        required: true
        schema:
          type: object
          properties:
            phone_number:
              type: string
      responses:
        201:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
              data:
                type: object
                properties:
                  otp_id:
                    type: string
              status:
                type: number
                default: 201
        400:
          description: Bad Request
        429:
          description: Throttled
  /auth/otp/verify/:
    post:
      tags:
      - AUTH
      summary: Verify OTP - READY
      description: ''
      operationId: verifyOTP
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: Verifies OTP
        required: true
        schema:
          type: object
          properties:
            otp_id:
              type: string
            otp_code:
              type: string
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
                default: true
              data:
                type: object
                properties:
                  tokens:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                  is_registered:
                    type: boolean
              status:
                type: number
                default: 200
        400:
          description: Bad Request
        429:
          description: Throttled
  /auth/otp/refresh/:
    post:
      tags:
      - AUTH
      summary: Refresh OTP - READY
      description: ''
      operationId: refreshOTP
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: refreshes OTP
        required: true
        schema:
          type: object
          properties:
            refresh_token:
              type: string
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
              data:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
              status:
                type: number
                default: 200
        400:
          description: Bad Request
        429:
          description: Throttled
  /profile/:
    get:
      tags:
      - Profile
      summary: Get Profile - READY
      description: ''
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
              data:
                type: object
                properties:
                  profile_id:
                    type: string
                  phone_number:
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  email:
                    type: string
                  birthdate:
                    type: string
                    format: date
                  gender:
                    type: string
                    default: M
                  is_phone_number_verified:
                    type: boolean
                  has_accepted_terms:
                    type: boolean
                  photo:
                    type: object
                    properties:
                      file:
                        type: string
                        format: url
              status:
                type: number
                default: 201
        400:
          description: Bad Request
        429:
          description: Throttled
    put:
      tags:
      - Profile
      summary: Create or Update Profile - READY
      description: Creates profile for new users(or the one that didn't complete)
      operationId: createProfile
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
      - in: body
        name: body
        description: Updates Profile
        required: true
        schema:
          type: object
          properties:
            birthdate:
              type: string
              format: date
            gender:
              type: string
              default: F
            photo:
              type: string
            first_name:
              type: string
            last_name:
              type: string
            bio:
              type: string
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
                default: true
              data:
                type: object
                properties:
                  profile:
                    type: object
                    properties:
                      profile_id:
                        type: string
                      phone_number:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      birthdate:
                        type: string
                        format: date
                      gender:
                        type: string
                        default: M
                      is_phone_number_verified:
                        type: boolean
                      has_accepted_terms:
                        type: boolean
                      photo:
                        type: object
                        properties:
                          file:
                            type: string
                            format: url
              status:
                type: number
                default: 200
        400:
          description: Bad Request
        401:
          description: Unauthorized
        403:
          description: forbidden
  /profile/wishlist/:
    post:
      tags:
      - Profile
      summary: Create Wishlist - READY
      description: create a wishlist
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
      - in: body
        name: body
        description: Create Wishlist
        required: true
        schema:
          type: object
          required:
          - name
          - description
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 150
            description:
              type: string
            cover:
              type: string
              format: uuid
              x-nullable: true
      responses:
        201:
          description: successful operation
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                  cover:
                    type: object
                    x-nullable: true
                    properties:
                      file:
                        type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              status:
                type: number
                default: 201
              created:
                type: boolean
        400:
          description: Bad Request
        401:
          description: Unauthorized
        403:
          description: forbidden
    get:
      tags:
      - Profile
      summary: Get User Wishlists - READY
      description: get user wishlists
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    description:
                      type: string
                    cover:
                      type: object
                      x-nullable: true
                      properties:
                        file:
                          type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
              status:
                type: number
                default: 200
        400:
          description: Bad Request
        429:
          description: Throttled
  /profile/avatar/:
