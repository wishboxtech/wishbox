  /storage/upload/:
    post:
      tags:
      - Storage
      summary: upload file
      description: ''
      operationId: uploadFile
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
      - in: formData
        name: file
        type: file
        required: true
        description: Upload File
      responses:
        201:
          description: successful operation
          schema:
            type: object
