post:
  tags:
    - "WALLET"
  summary: "Create Card - READY"
  description: "Create new card for a user"
  operationId: "createCard"
  consumes:
    - "application/json"
  produces:
    - "application/json"
  parameters:
    - in: "body"
      name: "body"
      description: "card number"
      required: true
      schema:
        $ref: "./definitions.yaml#/Card"
  responses:
    201:
      description: "successful operation"
      schema:
        type: "object"
        properties:
          ok:
            type: "boolean"
          data:
            $ref: "./definitions.yaml#/CardResponse"
          status:
            type: "number"
            default: 201
    400:
      description: "Bad Request"
    401:
      description: "Unauthorized"
