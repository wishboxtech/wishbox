swagger: '2.0'
info:
  description: Wishox API Dobcumentation; It's WIP
  version: 0.0.0
  title: Wishbox
host: api.gameparty.ir
basePath: /api/V0.0.0
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: access
tags:
- name: AUTH
  description: Authentication
schemes:
- https
- http
paths:
  /auth/otp/:
    $ref: ./auth/otp.yaml
  /auth/otp/verify/:
    $ref: ./auth/verify.yaml
  /auth/otp/refresh/:
    $ref: ./auth/refresh.yaml
  /profile/:
    $ref: ./profile/profile.yaml
  /profile/wishlist/:
    $ref: ./profile/wishlist.yaml
  /profile/avatar/:
    $ref: ./profile/avatar.yaml
  /storage/upload/:
    $ref: ./storage/upload.yaml
  /wishlist/{id}/:
    $ref: ./wishlist/wishlist.yaml
  /wishlist/{id}/wish/{wishid}/:
    $ref: ./wishlist/wish.yaml
  /wish/{id}/:
    $ref: ./wishlist/wish_by_id.yaml
  /wish/{id}/request/:
    $ref: ./wishlist/request.yaml
  /wish/create-anonymous-friend/:
    $ref: ./wishlist/anonymous_friend.yaml
