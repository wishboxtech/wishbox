    patch: &id011
      tags:
      - Gifting
      summary: Advance or cancel a gift
      description: Giver can purchase/cancel or reschedule once while reserved. Reschedule
        requires a later purchase_by within 7 days of the old plan and 30 days of
        today. Purchased gifts never auto-expire. Owner alone confirms arrival; arrival
        is not a satisfaction rating.
      produces:
      - application/json
      parameters:
      - name: id
        in: path
        required: true
        type: string
        format: uuid
      - name: X-Wishy-Gift-Token
        in: header
        required: false
        type: string
        description: Private token issued once for a reservation. Never include it
          in URLs or shared links.
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            action:
              type: string
              enum:
              - purchase
              - cancel
              - receive
              - reschedule
            purchase_by: *id005
          required:
          - action
      responses:
        200:
          description: Successful operation
          schema:
            type: object
            properties:
              ok: *id004
              status: *id002
              data: *id006
        400:
          description: Invalid input.
        404:
          description: Resource does not exist.
        403:
          description: Actor is not allowed to perform this action.
        409:
          description: Invalid or stale lifecycle transition.
