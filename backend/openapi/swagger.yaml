swagger: '2.0'
info:
  description: Wishy wishlist and gifting API. English and Persian interfaces; raw JWT Authorization header.
  version: 0.0.0
  title: Wishy
basePath: /api/V0.0.0
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: Authorization
tags:
- name: AUTH
  description: Authentication
schemes:
- https
- http
paths:
  /auth/otp/:
    post:
      tags:
      - AUTH
      summary: Send OTP - READY
      description: Send a new OTP in order to login or create a new guest
      operationId: sendOTP
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: Sends a new OTP
        required: true
        schema:
          type: object
          properties:
            phone_number:
              type: string
      responses:
        201:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
              data:
                type: object
                properties:
                  otp_id:
                    type: string
              status:
                type: number
                default: 201
        400:
          description: Bad Request
        429:
          description: Throttled
  /auth/otp/verify/:
    post:
      tags:
      - AUTH
      summary: Verify OTP - READY
      description: ''
      operationId: verifyOTP
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: Verifies OTP
        required: true
        schema:
          type: object
          properties:
            otp_id:
              type: string
            otp_code:
              type: string
            guest_key:
              type: string
              pattern: '^[a-f0-9]{64}$'
              description: Optional browser secret with explicit user consent. Claimed only when OTP verification creates a new account; ignored on existing-account login.
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
                default: true
              data:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  is_new_user:
                    type: boolean
                  guest_claimed:
                    type: boolean
              status:
                type: number
                default: 200
        400:
          description: Bad Request
        429:
          description: Throttled
  /auth/otp/refresh/:
    post:
      tags:
      - AUTH
      summary: Refresh OTP - READY
      description: ''
      operationId: refreshOTP
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: refreshes OTP
        required: true
        schema:
          type: object
          properties:
            refresh_token:
              type: string
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
              data:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
              status:
                type: number
                default: 200
        400:
          description: Bad Request
        429:
          description: Throttled
  /profile/:
    get:
      tags: [Profile]
      summary: Read the authenticated profile
      security: [{ApiKeyAuth: []}]
      responses:
        200:
          description: Profile data, including an optional versioned cat recipe.
          schema:
            type: object
            properties:
              ok: {type: boolean}
              data: {$ref: '#/definitions/Profile'}
              status: {type: integer}
        404:
          description: Complete profile setup first.
    put:
      tags: [Profile]
      summary: Create or partially update the authenticated profile
      description: Omitted fields are preserved. Identity comes from the authenticated session.
      security: [{ApiKeyAuth: []}]
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          properties:
            first_name: {type: string, maxLength: 150, x-nullable: true}
            last_name: {type: string, maxLength: 150, x-nullable: true}
            bio: {type: string, maxLength: 250, x-nullable: true}
            birthdate: {type: string, format: date, x-nullable: true}
            gender: {type: string, enum: [male, female, ''], x-nullable: true}
            photo: {type: string, format: uuid, x-nullable: true}
            cat_avatar: {$ref: '#/definitions/CatAvatar'}
      responses:
        202:
          description: Profile created or updated.
          schema:
            type: object
            properties:
              created: {type: boolean}
              data: {$ref: '#/definitions/Profile'}
              status: {type: integer}
        400:
          description: Invalid fields or cat recipe.
  /profile/wishlist/:
    post:
      tags:
      - Profile
      summary: Create Wishlist - READY
      description: create a wishlist
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      parameters:
      - in: body
        name: body
        description: Create Wishlist
        required: true
        schema:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 150
            description:
              type: string
            cover:
              type: string
              format: uuid
              x-nullable: true
      responses:
        201:
          description: successful operation
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                  cover:
                    type: object
                    x-nullable: true
                    properties:
                      file:
                        type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              status:
                type: number
                default: 201
              created:
                type: boolean
        400:
          description: Bad Request
        401:
          description: Unauthorized
        403:
          description: forbidden
    get:
      tags:
      - Profile
      summary: Get User Wishlists - READY
      description: get user wishlists
      consumes:
      - application/json
      produces:
      - application/json
      security:
      - ApiKeyAuth: []
      responses:
        200:
          description: successful operation
          schema:
            type: object
            properties:
              ok:
                type: boolean
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    description:
                      type: string
                    cover:
                      type: object
                      x-nullable: true
                      properties:
                        file:
                          type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
              status:
                type: number
                default: 200
        400:
          description: Bad Request
        429:
          description: Throttled
