  /wish/{id}/request/:
    post:
      tags: &id007
      - Gifting
      summary: Reserve a wish (legacy URL alias)
      description: Reserve using a verified session or guest nickname, with a chosen
        day, concrete next step and checked details. Holds expire at UTC midnight
        two days after purchase_by, covering the chosen day in every time zone. No
        payment is processed.
      produces: &id008
      - application/json
      parameters: &id009
      - name: id
        in: path
        required: true
        type: string
        format: uuid
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            guest_key:
              type: string
              pattern: '^[a-f0-9]{64}$'
              description: Optional private browser identity, distinct from the public visitor UUID. Used only for guest reservations.
            nickname:
              type: string
              minLength: 1
              maxLength: 150
            purchase_by:
              type: string
              format: date
              description: Today through 30 days ahead, validated by the server UTC
                calendar.
            purchase_plan:
              type: string
              minLength: 3
              maxLength: 160
            details_checked:
              type: boolean
              description: 'Must be true: the giver checked the exact wish details.'
          required:
          - purchase_by
          - purchase_plan
          - details_checked
      responses: &id010
        201:
          description: Successful operation
          schema:
            type: object
            properties:
