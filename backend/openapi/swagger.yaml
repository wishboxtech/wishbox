  /gifts/{id}/experience/:
    get:
      tags:
      - Gifting
      produces:
      - application/json
      parameters:
      - name: id
        in: path
        required: true
        type: integer
      - name: X-Wishy-Gift-Token
        in: header
        type: string
        description: Guest giver management key; never use query parameters.
      responses:
        200:
          description: Authorized actor-specific projection; private fit is never
            serialized for a giver.
          schema:
            type: object
            properties:
              ok:
                type: boolean
              status:
                type: integer
              data:
                type: object
                properties:
                  role:
                    type: string
                    enum:
                    - owner
                    - giver
                  gift:
                    type: object
                    description: Owner gets only a receipt summary (no private giver
                      plan). Giver gets their own gift/plan and explicitly shared
                      messages, never recipient fit/private_note.
                  fit:
                    type: string
                    description: Recipient-only; omitted for the giver.
                  private_note:
                    type: string
                    description: Recipient-only; omitted for the giver.
                  thank_you:
                    type: string
                    description: Recipient view only; giver receives the explicitly
                      shared note in gift.thank_you.
                  thank_you_sent_at: &id018
                    type: string
                    format: date-time
                    x-nullable: true
                  follow_up_note:
                    type: string
                  follow_up_sent_at: *id018
                  follow_up_acknowledged_at: *id018
        400:
          description: Invalid input.
        403:
          description: Actor cannot perform this action.
        404:
          description: Missing gift or actor is neither recipient nor giver.
        409:
          description: Arrival not yet confirmed or no follow-up to acknowledge.
      summary: Read a private gift journey or recipient check-in
      description: Recipient can see their private fit/note and shared messages. Registered/guest
        giver sees only their own plan, receipt, and messages the recipient explicitly
        shared. Receipt/keepsake is unchanged by private dissatisfaction. Cancelled/expired
        gift journeys remain accessible to their actors.
    patch:
      tags:
      - Gifting
      produces:
      - application/json
      parameters:
      - name: id
        in: path
        required: true
        type: integer
      - name: X-Wishy-Gift-Token
        in: header
        type: string
        description: Guest giver management key; never use query parameters.
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            action:
              type: string
              enum:
              - save_private
              - share_thanks
              - withdraw_thanks
              - share_follow_up
              - withdraw_follow_up
              - acknowledge_follow_up
            fit:
              type: string
              enum:
              - fits
              - adjust
              - not_for_me
              - trying
              x-nullable: true
            private_note:
              type: string
              maxLength: 800
            thank_you:
              type: string
              maxLength: 800
            follow_up_note:
              type: string
              maxLength: 800
          required:
          - action
      responses:
        200:
          description: Authorized actor-specific projection; private fit is never
            serialized for a giver.
          schema:
            type: object
            properties:
              ok:
                type: boolean
              status:
                type: integer
              data:
                type: object
                properties:
                  role:
                    type: string
                    enum:
                    - owner
                    - giver
                  gift:
                    type: object
                    description: Owner gets only a receipt summary (no private giver
                      plan). Giver gets their own gift/plan and explicitly shared
                      messages, never recipient fit/private_note.
                  fit:
                    type: string
                    description: Recipient-only; omitted for the giver.
                  private_note:
                    type: string
                    description: Recipient-only; omitted for the giver.
                  thank_you:
                    type: string
                    description: Recipient view only; giver receives the explicitly
                      shared note in gift.thank_you.
                  thank_you_sent_at: &id019
                    type: string
                    format: date-time
                    x-nullable: true
                  follow_up_note:
                    type: string
                  follow_up_sent_at: *id019
                  follow_up_acknowledged_at: *id019
        400:
          description: Invalid input.
        403:
          description: Actor cannot perform this action.
        404:
          description: Missing gift or actor is neither recipient nor giver.
        409:
          description: Arrival not yet confirmed or no follow-up to acknowledge.
      summary: Save private feedback, share/withdraw a note, or acknowledge a practical
        note
      description: Only recipient can save_private, share_thanks, withdraw_thanks,
        share_follow_up or withdraw_follow_up, after confirmed arrival. No private
        save produces a notification. Only giver can acknowledge_follow_up. Sharing
        requires a nonblank corresponding message. Sharing/notification is transactional.
        No rating, score, or public review is created.

definitions:
    CatAvatar:
      type: object
      x-nullable: true
      additionalProperties: false
      description: Version 1 composable cat recipe. Omit to preserve; null selects a photo. Missing parts default to zero.
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 1
          default: 1
        face:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        ears:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        eyes:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        pupils:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        brows:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        nose:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        mouth:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        whiskers:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        markings:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        accessories:
          type: integer
          minimum: 0
          maximum: 49
          default: 0
        fur:
          type: integer
          minimum: 0
          maximum: 15
          default: 0
        background:
          type: integer
          minimum: 0
          maximum: 11
          default: 0
    Profile:
      type: object
      properties:
        profile_id: {type: string, format: uuid}
        phone_number: {type: string, x-nullable: true}
        email: {type: string, x-nullable: true}
        first_name: {type: string, x-nullable: true}
        last_name: {type: string, x-nullable: true}
        bio: {type: string, x-nullable: true}
        birthdate: {type: string, format: date, x-nullable: true}
        gender: {type: string, x-nullable: true}
        is_phone_number_verified: {type: boolean}
        has_accepted_terms: {type: boolean}
        cat_avatar: {$ref: '#/definitions/CatAvatar'}
        photo:
          type: object
          x-nullable: true
          properties:
            file: {type: string}
