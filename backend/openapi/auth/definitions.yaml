PhoneNumber:
  type: "object"
  properties:
    phone_number:
      type: "string"

OTPResponse:
  type: "object"
  properties:
    otp_id:
      type: "string"

InVerifyOTP:
  type: "object"
  properties:
    otp_id:
      type: "string"
    otp_code:
      type: "string"
    guest_key:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: Optional browser secret; explicit signup-only claim consent.
