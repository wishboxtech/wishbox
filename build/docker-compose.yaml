
services:
  backend:
    build:
      context: ../.
      dockerfile: ./build/compose/local/django/Dockerfile
    image: wishy_backend
    container_name: dev_backend
    command: /start
    volumes:
      - ../.:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres
    networks:
      - app_network

  postgres:
    image: postgres:14
    container_name: dev_db
    environment:
      POSTGRES_DB: wishbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: dev_redis
    ports:
      - "6379:6379"
    networks:
      - app_network

  celery_worker:
    build:
      context: ../.
      dockerfile: ./build/compose/local/django/Dockerfile
    image: wishy_celery_worker
    container_name: wishy_celery_worker
    command: /start-celeryworker
    volumes:
      - ../.:/app
    depends_on:
      - redis
      - postgres
    networks:
      - app_network
    env_file:
      - ../.env

  celery_beat:
    build:
      context: ../.
      dockerfile: ./build/compose/local/django/Dockerfile
    image: wishy_celery_beat
    container_name: wishy_celery_beat
    command: /start-celerybeat
    volumes:
      - ../.:/app
    depends_on:
      - redis
      - postgres
    networks:
      - app_network
    env_file:
      - ../.env

  celery_flower:
    build:
      context: ../.
      dockerfile: ./build/compose/local/django/Dockerfile
    image: wishy_celery_flower
    container_name: wishy_celery_flower
    command: /start-flower
    volumes:
      - ../.:/app
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - postgres
    networks:
      - app_network
    env_file:
      - ../.env

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - app_network


volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
