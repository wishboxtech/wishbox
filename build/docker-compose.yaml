  #     - discovery.type=single-node
  #   mem_limit: 1g
  #   tty: true 
  #   networks:
  #     - app_network

  # nats-server:
  #   image: nats:latest
  #   container_name: nats-server
  #   ports:
  #     - "4222:4222"
  #     - "8222:8222"
  #     - "6222:6222"
