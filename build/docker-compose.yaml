name: wishbox
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DEFAULT_DATABASE_NAME:-wishbox}
      POSTGRES_USER: ${DEFAULT_DATABASE_USER:-wishbox}
      POSTGRES_PASSWORD: ${DEFAULT_DATABASE_PASSWORD:-wishbox-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  back:
    image: wishbox-back
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env.local
    environment:
      STAGE: local
      DEFAULT_DATABASE_HOST: postgres
      DEFAULT_DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/usr/src/app/media
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/V0.0.0/openapi/schema.yaml')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
  gift-worker:
    image: wishbox-back
    pull_policy: never
    env_file: ../.env.local
    environment:
      STAGE: local
      DEFAULT_DATABASE_HOST: postgres
      DEFAULT_DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "maintain_gifts", "--loop", "--interval", "60"]
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/wishy-gifts-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 180"]
      interval: 30s
      timeout: 3s
      retries: 4
      start_period: 15s
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
  media:
